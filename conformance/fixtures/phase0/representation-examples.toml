version = 1

[[example]]
id = "prose"
domain = "prose"

[[example.node]]
alias = "document"
role = "document"
kind = "FILE"
payload = ""
expected_profile = "external-file"
expected_holder = "file:examples/prose.md"
minimum_identity = "anchored"

[[example.node]]
alias = "paragraph"
role = "paragraph"
kind = "PARAGRAPH"
payload = "hello"
expected_profile = "external-file"
expected_holder = "file:examples/prose.md"
minimum_identity = "anchored"

[[example.relation]]
role = "contains"
kind = "COMMENT"
from = "document"
to = "paragraph"
payload = "contains"
expected_profile = "graph-native"
expected_holder = "graph"
minimum_identity = "managed"


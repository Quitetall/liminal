# Generated by just assurance-workflows. Edit template/command registry, then regenerate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

defaults:
  run:
    shell: bash

jobs:
  style:
    name: fmt / toml / typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: just,taplo-cli,typos-cli
      - run: |
@@STYLE@@

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: |
@@CLIPPY@@

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # F-90: the qualification tooling is Unix in substance -- strace,
      # sanitizers, flock/fork semantics, SIGKILL crash matrices, dev/inode
      # hard-link identity -- and never compiled on Windows. These four crates
      # are that tooling and its dependents; every test in them still runs on
      # Linux and macOS. scripts/run_ci_tests.sh applies it.
      EXCLUDE_UNIX_TOOLING: ${{ matrix.os == 'windows-latest' && '--exclude liminal-xtask --exclude liminal-conformance --exclude spike-annotation --exclude spike-richedit' || '' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - name: Provision Linux bounded-execution prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-user-session strace
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Portable test coverage
        run: |
@@PORTABILITY@@
      - name: Remaining Linux merge checks
        if: runner.os == 'Linux'
        run: |
@@LINUX@@
      - name: Preserve bounded resource receipts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: assurance-resource-receipts
          path: ${{ runner.temp }}/liminal-resource-*
          if-no-files-found: warn

  # The other half of the declared split (F-79). Every requirement here was
  # named by a failure on a clean runner, not guessed (F-84, F-90):
  # - ubuntu-24.04, not -latest: -latest moves to Ubuntu 26 from 2026-10-19,
  #   and this job's tools come from the image.
  # - fetch-depth 0: real_cst and the canary replays read pinned commits.
  # - pandoc from the upstream release: M10 pins 3.10.2; apt ships 3.1.3.
  # - the pinned nightly and a source-built cargo-fuzz: sanitizer builds are
  #   byte-reproducible only on one compiler, and cargo-binstall's musl
  #   cargo-fuzz compiled every target for musl, which ASan refuses.
  # - cargo fetch: vstd admission resolves metadata for every platform.
  # - `threaded` (just test-threaded) runs here, not in `test`: it is every
  #   test in one libtest process, host-capability tests included, and on the
  #   plain runner it failed for want of pandoc.
  # Each tool is verified present, so a missing one fails the job rather than
  # skipping its tests.
  host-capability:
    name: host-capability (ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      PANDOC_VERSION: 3.10.2
      SANITIZER_TOOLCHAIN: nightly-2026-06-22
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - run: rustup toolchain install "$SANITIZER_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      # `threaded` runs here too (every test, in one process), so this job needs
      # the same bounded-execution session as the test job's Linux leg.
      - name: Provision Linux bounded-execution prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-user-session strace
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: install the pinned pandoc
        run: |
          deb="pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -fsSLo "/tmp/$deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/$deb"
          sudo dpkg -i "/tmp/$deb"
      - run: cargo fetch
      - name: every declared capability must be present
        run: |
          pandoc --version | head -1 | grep -qx "pandoc ${PANDOC_VERSION}"
          strace -V | head -1
          cargo "+${SANITIZER_TOOLCHAIN}" fuzz --version | grep -qx "cargo-fuzz ${CARGO_FUZZ_VERSION}"
          test -w /var/tmp
          git cat-file -e HEAD~1
      - run: |
@@HOST@@

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: |
@@DOCS@@

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: |
@@DENY@@

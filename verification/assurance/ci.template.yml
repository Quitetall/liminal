# Generated by just assurance-workflows. Edit template/command registry, then regenerate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

defaults:
  run:
    shell: bash

jobs:
  style:
    name: fmt / toml / typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: just,taplo-cli,typos-cli
      - run: |
@@STYLE@@

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: |
@@CLIPPY@@

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - name: Provision Linux bounded-execution prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-user-session strace
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Portable test coverage
        run: |
@@PORTABILITY@@
      - name: Remaining Linux merge checks
        if: runner.os == 'Linux'
        run: |
@@LINUX@@
      - name: Preserve bounded resource receipts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: assurance-resource-receipts
          path: ${{ runner.temp }}/liminal-resource-*
          if-no-files-found: warn

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: |
@@DOCS@@

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: |
@@DENY@@

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []     # every entry requires an inline reason = "..." comment

[licenses]
version = 2
# Allowlist for DEPENDENCIES; the project itself is Apache-2.0 (ADR-0001).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
# MPL-2.0 / OpenSSL-style licenses are not blanket-allowed; add per-crate
# [[licenses.exceptions]] entries with justification when a dependency forces it.
exceptions = []

[licenses.private]
ignore = true # workspace crates are publish = false

[bans]
multiple-versions = "warn" # tighten to "deny" + skip-tree at Phase 1
wildcards = "deny"
allow-wildcard-paths = true # internal path deps carry no version pre-publish (publish = false workspace)
deny = [
  { crate = "openssl", reason = "rustls-only policy" },
  { crate = "openssl-sys", reason = "rustls-only policy" },
  { crate = "git2", reason = "identity torture corpus drives the real git CLI (merge-ort fidelity); gitoxide preferred later; ADR required to override" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []            # any entry requires an ADR (pinned rev only, never a branch)

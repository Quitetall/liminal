# nextest is mandatory (not optional-alongside-libtest) because process-per-test
# isolation is a correctness requirement for crash-injection tests (spec v4 §113,
# R4 §10: daemon termination after every ILRP durable boundary).

[test-groups]
# Crash tests own scratch workspaces and kill child processes; they must not
# interleave. The group is serialized, not the whole run.
crash = { max-threads = 1 }

[profile.default]
fail-fast = true
slow-timeout = { period = "30s" }

[[profile.default.overrides]]
# Convention: crash tests are named crash_* (any package).
filter = 'test(/^crash_/) | test(/^haq::tests::crash_/)'
test-group = "crash"
slow-timeout = { period = "120s", terminate-after = 2 }
retries = 0                                              # a flaky crash-recovery test is a FINDING, never retried away

[profile.ci]
fail-fast = false                                      # full failure surface per run
retries = 0                                            # falsification culture: no flake-masking anywhere
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"

# Generated by just assurance-workflows. Edit template/command registry, then regenerate.
name: Scheduled

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: |
          'cargo' 'deny' 'check' 'advisories'

  beta-canary:
    name: beta toolchain canary
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install beta --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: |
          'cargo' '+beta' 'check' '--workspace' '--all-targets'

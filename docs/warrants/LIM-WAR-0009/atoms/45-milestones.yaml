schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Concrete design and actual semantic acceptance before implementation"
    stage_refs: ["STAGE-001", "STAGE-002"]
    obligation_refs: ["OBL-004"]

  - id: "M2"
    title: "Bounded implementation and complete positive and refusal evidence"
    depends_on: ["M1"]
    stage_refs: ["STAGE-003", "STAGE-004", "STAGE-005"]
    obligation_refs: ["OBL-001", "OBL-002"]

  - id: "M3"
    title: "Independent evidence and actual scoped decisions established"
    depends_on: ["M2"]
    stage_refs: ["STAGE-006"]
    obligation_refs: ["OBL-003"]

stages:
  - id: "STAGE-001"
    title: "Design the restricted OpenWarrant document/frontmatter boundary, versioned process protocol and canonical IR"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-002"
    title: "Brian accepts the exact protocol, canonical IR and supported-document semantics before adapter implementation"
    executor_kind: "human"
    responsibility_tier: "T1"

  - id: "STAGE-003"
    title: "Implement the adapter and compiler subprocess strictly against the accepted interface revision"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-004"
    title: "Run real end-to-end process conformance and predeclared malformed/unsupported/version/Basis refusal controls"
    executor_kind: "agent"
    responsibility_tier: "T3"

  - id: "STAGE-005"
    title: "Reconcile exact design revisions, corpus examples, command logs, artifact hashes and retained evidence"
    executor_kind: "agent"
    responsibility_tier: "T4"

  - id: "STAGE-006"
    title: "Obtain independent interface and adapter review and Brian's actual scoped acceptance before profile work"
    executor_kind: "human"
    responsibility_tier: "T1"


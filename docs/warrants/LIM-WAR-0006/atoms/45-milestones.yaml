schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Bounded delivery and refusal evidence collected"
    stage_refs: ["STAGE-001", "STAGE-002", "STAGE-003", "STAGE-004", "STAGE-005"]
    obligation_refs: ["OBL-001", "OBL-002"]

  - id: "M2"
    title: "Independent evidence and actual scoped decisions established"
    depends_on: ["M1"]
    obligation_refs: ["OBL-003"]

stages:
  - id: "STAGE-001"
    title: "Create `liminal-html` and implement the closed role mapping and exact escaping/framing rules"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-002"
    title: "Render every full fixture, independently inspect hostile escaping, and accept exact snapshots"
    executor_kind: "human"
    responsibility_tier: "T1"

  - id: "STAGE-003"
    title: "Implement Basis-bound block patches and independent patch application"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-004"
    title: "Remove only the two named ignores and run both gates normally"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-005"
    title: "Reconcile the Phase 1 implementation meter"
    executor_kind: "agent"
    responsibility_tier: "T4"


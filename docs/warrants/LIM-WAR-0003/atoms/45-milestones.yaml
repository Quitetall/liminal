schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Bounded delivery and refusal evidence collected"
    stage_refs: ["STAGE-001", "STAGE-002", "STAGE-003", "STAGE-004", "STAGE-005", "STAGE-006", "STAGE-007"]
    obligation_refs: ["OBL-001", "OBL-002"]

  - id: "M2"
    title: "Independent evidence and actual scoped decisions established"
    depends_on: ["M1"]
    obligation_refs: ["OBL-003"]

stages:
  - id: "STAGE-001"
    title: "Implement annotations, exact SourceMap validation, and the eight-form HIR schema"
    executor_kind: "agent"
    responsibility_tier: "T3"

  - id: "STAGE-002"
    title: "Lower compact and explicit CSTs into one deterministic HIR without executing macros"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-003"
    title: "Resolve HIR into a Basis-bound derived graph with Anchored provenance and deterministic IDs"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-004"
    title: "Implement strict stable-debug-JSON v1 and the canonical explicit emitter"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-005"
    title: "Fill and flip only the existing canonical round-trip gate"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-006"
    title: "Run full repository verification"
    executor_kind: "agent"
    responsibility_tier: "T3"

  - id: "STAGE-007"
    title: "Close milestone"
    executor_kind: "agent"
    responsibility_tier: "T4"


schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Bounded delivery and refusal evidence collected"
    stage_refs: ["STAGE-001", "STAGE-002", "STAGE-003", "STAGE-004", "STAGE-005"]
    obligation_refs: ["OBL-001", "OBL-002"]

  - id: "M2"
    title: "Independent evidence and actual scoped decisions established"
    depends_on: ["M1"]
    obligation_refs: ["OBL-003"]

stages:
  - id: "STAGE-001"
    title: "Add the exact private Salsa dependency wiring"
    executor_kind: "agent"
    responsibility_tier: "T4"

  - id: "STAGE-002"
    title: "Implement explicit source/Basis inputs and the fresh-database full oracle behind Liminal interfaces"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-003"
    title: "Implement the incremental path and fold equality, invalidation, stale-Basis, malformed, and replay matrices into the existing gate"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-004"
    title: "Remove only this gate's ignore and rerun it normally"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-005"
    title: "Reconcile the milestone meter"
    executor_kind: "agent"
    responsibility_tier: "T4"


schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Aggregate and complete HAQP-1b evidence collected"
    stage_refs: ["STAGE-001", "STAGE-002", "STAGE-003", "STAGE-004", "STAGE-005"]
    obligation_refs: ["OBL-001", "OBL-002"]

  - id: "M2"
    title: "Independent both-stage review and actual human decision"
    depends_on: ["M1"]
    stage_refs: ["STAGE-006", "STAGE-007"]
    obligation_refs: ["OBL-003", "OBL-004"]

stages:
  - id: "STAGE-001"
    title: "Run the exact seven-test Phase 1 aggregate"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-002"
    title: "Verify the authored no-trigger migration branch"
    executor_kind: "agent"
    responsibility_tier: "T1"

  - id: "STAGE-003"
    title: "Run the complete repository continuous lane after the last fix"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-004"
    title: "Reconcile the final Phase 1 meter"
    executor_kind: "agent"
    responsibility_tier: "T4"

  - id: "STAGE-005"
    title: "Execute every frozen mutation clause with full rerun and exact exclusion proof"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-006"
    title: "Obtain independent blind review of both stages and verify every finding centrally"
    executor_kind: "agent"
    responsibility_tier: "T1"

  - id: "STAGE-007"
    title: "Report authority separately and present final suite ratification to Brian after both-stage qualification"
    executor_kind: "agent"
    responsibility_tier: "T1"


schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Concrete design and actual semantic acceptance before implementation"
    stage_refs: ["STAGE-001", "STAGE-002"]
    obligation_refs: ["OBL-004"]

  - id: "M2"
    title: "Bounded implementation and complete positive and refusal evidence"
    depends_on: ["M1"]
    stage_refs: ["STAGE-003", "STAGE-004", "STAGE-005"]
    obligation_refs: ["OBL-001", "OBL-002"]

  - id: "M3"
    title: "Independent evidence and actual scoped decisions established"
    depends_on: ["M2"]
    stage_refs: ["STAGE-006"]
    obligation_refs: ["OBL-003"]

stages:
  - id: "STAGE-001"
    title: "Design the bounded release build and packaging procedure from exact qualified source/profile inputs"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-002"
    title: "Brian accepts the release construction scope and eligible evidence baseline; this is not publication approval"
    executor_kind: "human"
    responsibility_tier: "T1"

  - id: "STAGE-003"
    title: "Build reproducible compiler artifacts and package exact version/profile pins, usage documentation and compatibility limits"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-004"
    title: "Run real installation/usage smoke scenarios and unsupported-input, altered-artifact and missing-evidence refusal controls"
    executor_kind: "agent"
    responsibility_tier: "T3"

  - id: "STAGE-005"
    title: "Retain reproducible build comparisons, artifact hashes, exact pins and eligible both-stage and parity evidence"
    executor_kind: "agent"
    responsibility_tier: "T4"

  - id: "STAGE-006"
    title: "Obtain independent release verification and Brian's actual release decision before publication"
    executor_kind: "human"
    responsibility_tier: "T1"


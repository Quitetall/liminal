schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Concrete design and actual semantic acceptance before implementation"
    stage_refs: ["STAGE-001", "STAGE-002"]
    obligation_refs: ["OBL-004"]

  - id: "M2"
    title: "Bounded implementation and complete positive and refusal evidence"
    depends_on: ["M1"]
    stage_refs: ["STAGE-003", "STAGE-004", "STAGE-005"]
    obligation_refs: ["OBL-001", "OBL-002"]

  - id: "M3"
    title: "Independent evidence and actual scoped decisions established"
    depends_on: ["M2"]
    stage_refs: ["STAGE-006"]
    obligation_refs: ["OBL-003"]

stages:
  - id: "STAGE-001"
    title: "Design one compiler profile and the complete pin manifest from LIM-WAR-0009 accepted interfaces"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-002"
    title: "Brian accepts the exact profile design and enumerated qualification inputs before immutable pins are captured"
    executor_kind: "human"
    responsibility_tier: "T1"

  - id: "STAGE-003"
    title: "Capture real compiler/OpenWarrant source revisions, dependency locks, toolchains and complete corpus inventory digests"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-004"
    title: "Reproduce profile selection in a clean environment and run missing/mutable/drifting-pin refusal controls"
    executor_kind: "agent"
    responsibility_tier: "T3"

  - id: "STAGE-005"
    title: "Reconcile every pinned input and corpus member and retain exact provenance and replay instructions"
    executor_kind: "agent"
    responsibility_tier: "T4"

  - id: "STAGE-006"
    title: "Obtain independent profile/pin verification and Brian's actual scoped acceptance before parity"
    executor_kind: "human"
    responsibility_tier: "T1"


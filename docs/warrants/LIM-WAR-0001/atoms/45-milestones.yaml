schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Bounded delivery and refusal evidence collected"
    stage_refs: ["STAGE-001", "STAGE-002", "STAGE-003", "STAGE-004", "STAGE-005"]
    obligation_refs: ["OBL-001", "OBL-002", "OBL-003"]

  - id: "M2"
    title: "Independent evidence and actual scoped decisions established"
    depends_on: ["M1"]
    obligation_refs: ["OBL-004"]

stages:
  - id: "STAGE-001"
    title: "Complete HAQP-1a, independently verify fresh blind findings and produce the proposed packet"
    executor_kind: "agent"
    responsibility_tier: "T1"

  - id: "STAGE-002"
    title: "Obtain user GO/NO-GO on Phase 0, record the next free accepted ADR, and flip its gate"
    executor_kind: "human"
    responsibility_tier: "T1"

  - id: "STAGE-003"
    title: "Run full repository verification"
    executor_kind: "agent"
    responsibility_tier: "T1"

  - id: "STAGE-004"
    title: "Reconcile final meter"
    executor_kind: "agent"
    responsibility_tier: "T4"

  - id: "STAGE-005"
    title: "Deliver the proposed suite and report actual Phase GO separately; final suite ratification remains at M24"
    executor_kind: "agent"
    responsibility_tier: "T1"


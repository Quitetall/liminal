# Conformance corpora contain DELIBERATELY damaged text (spec R4 §2.2 adversarial
# traces) and must never be "fixed". spec/v4/ is canonical and verbatim.

[default]
# Git SHAs in backticks are hex, not prose. `c4ba072` tripped `ba -> by/be` and
# took `just ci` red for four commits (M17.5, found while fixing F-17). Every
# findings document cites commits this way, so ignoring the construct is the
# durable fix rather than rewording one SHA and waiting for the next collision.
extend-ignore-re = [
  "`[0-9a-fA-F]{7,40}`",
  # Machine-readable proposal pins use JSON strings rather than Markdown code.
  '"[0-9a-fA-F]{7,40}"',
  # Codegen-unit names such as `cst_parse.6be4151ba0cf3c2-cgu.0` are cited
  # verbatim in the findings (F-42); a bare hex run is an identifier, not prose.
  "[0-9a-f]{12,}",
]

[default.extend-words]
# Operational Transformation — collaboration algorithm family (v4 §7.6, §123).
OT = "OT"
# Stenographic macro from the spec's Rust pack: `fpr` = public Result-returning fn (v4 §30).
fpr = "fpr"
# M07 identity-matrix code abbreviates "strategy" as `strat`/`strat_idx`.
strat = "strat"

[files]
extend-exclude = [
  "target/**",
  "conformance/fixtures/**",
  "conformance/haqp/evidence/logs/**",
  "conformance/haqp/evidence/probes/**",
  # strace output, not prose: it captures truncated argv like
  # `profile.release.debug="line-tabl...` and every path on this machine.
  "conformance/haqp/evidence/access/**",
  # Reviewer records, their raw answers and Codex session transcripts: verbatim
  # provider output, including base64 blobs and a model's own prose. Correcting
  # a reviewer's spelling would alter evidence the gate hashes (M17.5 F-51).
  "conformance/haqp/evidence/reviews/**",
  "docs/execution/reviews/**",
  "conformance/corpora/**",
  "conformance/golden/**",
  "**/snapshots/*.snap",
  "*.lock",
  "spec/v4/**",
  # Exact historical source transcriptions, including deliberate examples and
  # the v3-to-v4 diff. sas-check proves lossless reproduction and source hashes;
  # authored migration policy and Warrant atoms remain spellchecked.
  "docs/sas/LIMINAL_Software_Architecture_Specification.md",
  "docs/migration/source-map.json",
  "docs/migration/source-crosswalk.json",
]
